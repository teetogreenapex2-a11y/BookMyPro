workflows:
  ios-workflow:
    name: BookMyPro iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # "codemagic" here has to exactly match whatever name you give the
      # App Store Connect API key when you add it in Codemagic's own
      # Team settings - if you name it something else there, change this
      # line to match.
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bookmypro.app
      vars:
        # No .xcworkspace exists here - that file is specifically what
        # CocoaPods creates to wrap the project together with its Pods
        # dependency; since this uses Swift Package Manager instead,
        # there's only a regular .xcodeproj to point at.
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      # The app loads the real, live website directly (see server.url in
      # capacitor.config.ts) rather than a locally bundled copy, so there's
      # no "npm run build" step here the way a typical Capacitor project
      # would have - the only thing that actually needs to sync into the
      # native project is the small set of local assets (the offline
      # fallback page, the app icon, etc.) plus the installed plugins.
      - name: Add iOS platform
        script: |
          # Always start fresh rather than checking if the folder merely
          # exists - a leftover, partial ios folder from an earlier failed
          # build attempt could otherwise cause this to be skipped even
          # though the actual native project (Podfile and all) was never
          # properly generated.
          rm -rf ios
          npx cap add ios
      - name: Add required permission descriptions to Info.plist
        script: |
          # Apple rejects a build outright if it references a sensitive
          # API (camera, photo library, microphone) without a matching,
          # user-facing explanation string for why the app needs it -
          # this is exactly what the first TestFlight submission was
          # rejected for. Since the ios folder never persists between
          # builds, this has to be injected fresh here rather than as a
          # one-time edit to a file that would otherwise get wiped out
          # and regenerated from scratch on every single build.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Used to record your golf swing for review with your instructor.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Used to save and access swing videos you record.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Used to save recorded swing videos to your photo library.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Used to record audio during swing videos and remote video lessons.'" "$PLIST" || true
      - name: Generate iOS app icon
        script: |
          # The ios folder never persists between builds (it's rebuilt
          # from scratch every time above), so this step - unlike the
          # matching one already run once, locally, for Android - has
          # never actually had a chance to run before now. Uses the same
          # source icon.png as Android for a consistent, real app icon
          # instead of Capacitor's generic default.
          npx @capacitor/assets generate --ios
      - name: Add native tab bar
        script: |
          # Same real, native bottom tab bar built for Android tonight,
          # now on iOS too - this copies in the Swift file, registers it
          # with the Xcode project so it's actually compiled in (the
          # same real gap that caused the Firebase crash earlier tonight
          # applies here too), and points the storyboard at this class
          # instead of Capacitor's own default one.
          cp ios-config/MainViewController.swift ios/App/App/MainViewController.swift
          ruby -e '
            require "xcodeproj"
            project_path = "ios/App/App.xcodeproj"
            project = Xcodeproj::Project.open(project_path)
            target = project.targets.first
            group = project.main_group.find_subpath("App", true)
            file_ref = group.new_reference("MainViewController.swift")
            target.source_build_phase.add_file_reference(file_ref)
            project.save
            puts "Registered MainViewController.swift with Xcode project"
          '
          # Point the storyboard's root view controller at the new
          # class instead of Capacitor'\''s own default one. A storyboard
          # tracks the class name and which module it lives in as two
          # separate attributes - changing only the class name earlier
          # left the module reference still pointed at Capacitor'\''s own
          # framework, where a class called MainViewController doesn'\''t
          # exist at all, which is the likely real reason none of this
          # code ever actually ran.
          echo "--- Main.storyboard BEFORE change ---"
          grep -o 'customClass="[^"]*"\|customModule="[^"]*"' ios/App/App/Base.lproj/Main.storyboard || echo "Neither attribute found at all"
          sed -i '' 's/customClass="CAPBridgeViewController"/customClass="MainViewController"/; s/customModule="Capacitor"/customModule="App"/' ios/App/App/Base.lproj/Main.storyboard
          echo "--- Main.storyboard AFTER change ---"
          grep -o 'customClass="[^"]*"\|customModule="[^"]*"' ios/App/App/Base.lproj/Main.storyboard || echo "Neither attribute found at all"
          if grep -q 'customClass="MainViewController"' ios/App/App/Base.lproj/Main.storyboard && grep -q 'customModule="App"' ios/App/App/Base.lproj/Main.storyboard; then
            echo "SUCCESS: storyboard now points at MainViewController in the App module"
          else
            echo "WARNING: storyboard replacement did not fully take effect"
          fi
          # The real, actual place the root screen gets set turned out to
          # be SceneDelegate.swift directly, not the storyboard at all -
          # it explicitly instantiates CAPBridgeViewController() in code,
          # completely bypassing whatever the storyboard says. The
          # storyboard change above was correct in principle, just aimed
          # at a file this particular app doesn't actually use for this.
          echo "--- SceneDelegate.swift BEFORE change ---"
          grep 'rootViewController' ios/App/App/SceneDelegate.swift || echo "No rootViewController line found"
          sed -i '' 's/CAPBridgeViewController()/MainViewController()/' ios/App/App/SceneDelegate.swift
          echo "--- SceneDelegate.swift AFTER change ---"
          grep 'rootViewController' ios/App/App/SceneDelegate.swift || echo "No rootViewController line found"
      - name: Add Firebase iOS config
        script: |
          # Without this, Firebase's own initialization fails outright
          # the moment the app launches, before anything else - even the
          # splash screen - ever gets a chance to render. This is the
          # ios-specific equivalent of the google-services.json already
          # in place for Android; both come from the same Firebase
          # project, just registered as two separate "apps" within it.
          #
          # Just placing the file on disk here isn't actually enough on
          # its own, though - that was the real reason this kept
          # crashing even after adding it. Xcode only bundles files it's
          # explicitly told about in the project's own internal file
          # list; a file merely sitting in the folder is invisible to
          # the compiled app unless it's properly registered, which is
          # what the script below actually does.
          cp ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          ruby -e '
            require "xcodeproj"
            project_path = "ios/App/App.xcodeproj"
            project = Xcodeproj::Project.open(project_path)
            target = project.targets.first
            group = project.main_group.find_subpath("App", true)
            file_ref = group.new_reference("GoogleService-Info.plist")
            target.resources_build_phase.add_file_reference(file_ref)
            project.save
            puts "Registered GoogleService-Info.plist with Xcode project"
          '
      - name: Add required privacy purpose strings to Info.plist
        script: |
          # Apple's own automated review rejected the last build
          # specifically for this - iOS requires a human-readable
          # explanation for any API that could touch a person's photos,
          # camera, or microphone, shown to them the first time the app
          # actually asks for that access. The camera plugin (used for
          # recording and saving swing videos) references all three of
          # these, so all three need a real string here, not just the
          # one Apple's rejection email specifically named - otherwise
          # the next submission would likely just get rejected again for
          # the other two in turn.
          PLIST="ios/App/App/Info.plist"
          # Answers Apple's export compliance question permanently,
          # right in the app's own config, rather than needing to
          # manually answer it by hand for every single future build -
          # correct here since the app only ever uses standard HTTPS,
          # nothing exotic enough to need the fuller declaration.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'BookMyPro saves your recorded swing videos to your photo library so you can review them later.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'BookMyPro uses your camera to record your golf swing for review.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'BookMyPro records audio along with your swing video.'" "$PLIST" || true
      - name: Add Google Sign-In URL scheme
        script: |
          # Google Sign-In on iOS specifically needs a "URL scheme"
          # registered so the system knows to hand control back to this
          # app once someone finishes signing in through Google's own
          # screen - without it, the native sign-in flow fails outright
          # ("Couldn't sign in with Google") even though the exact same
          # setup already works correctly on Android, since Android
          # doesn't have this particular requirement. This is the
          # reversed form of the dedicated iOS OAuth client created
          # specifically for this app in Google Cloud Console (separate
          # from the Android and web client IDs already in use
          # elsewhere).
          PLIST="ios/App/App/Info.plist"
          # The underlying native Google Sign-In SDK needs its own client
          # ID key directly in Info.plist, separate from the URL scheme
          # below - confirmed as the real, exact cause after temporarily
          # exposing the actual error message on screen, which named this
          # specific missing key directly.
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string 748505012241-0ri4odsjmdmbcv9usac2ka67pgbqf9ao.apps.googleusercontent.com" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.googleusercontent.apps.748505012241-0ri4odsjmdmbcv9usac2ka67pgbqf9ao" "$PLIST" || true
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      # No CocoaPods step here - this version of Capacitor generates a
      # Package.swift instead of a Podfile (confirmed by the "Add iOS
      # platform" step's own log output: "Writing Package.swift"),
      # meaning it uses Apple's own Swift Package Manager for plugin
      # dependencies. Xcode resolves those automatically as part of the
      # actual build itself, so there's nothing separate to install here
      # the way CocoaPods would have needed.
      - name: Set build number
        script: |
          # Apple requires every single upload to have a strictly higher
          # build number than anything ever uploaded before for this app
          # - every attempt tonight has been stuck at the same hardcoded
          # "1", which is exactly why this kept getting rejected once the
          # actual build itself finally started succeeding. Codemagic's
          # own $BUILD_NUMBER counts up automatically with every build
          # it runs, so using that directly guarantees this is always
          # genuinely new.
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
          cd ../..
      - name: Add push notification entitlements
        script: |
          # Enabling the capability on the App ID over in Apple's own
          # developer portal is only half of what's needed - the app
          # itself also has to explicitly request this permission
          # through its own signing, or iOS will never actually
          # register the device for real notifications at all. This
          # writes that request directly, then wires it into the
          # Xcode project so it's actually included when the app is
          # signed and built.
          cat > ios/App/App/App.entitlements << 'ENTITLEMENTS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
            <key>com.apple.developer.applesignin</key>
            <array>
              <string>Default</string>
            </array>
          </dict>
          </plist>
          ENTITLEMENTS
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = project.targets.first
            target.build_configurations.each do |config|
              config.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
            end
            project.save
            puts "Wired App.entitlements into the Xcode project"
          '
      - name: Diagnose project file directly
        script: |
          # The wrapper tool's own error message ("Failed to show build
          # settings") gave no actual detail about what's really wrong -
          # calling xcodebuild directly here shows Xcode's own, real
          # error text instead, which should tell us the genuine reason.
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings || true
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      # Matches wherever the build actually places the .ipa, whether
      # that ends up being repo-root-relative or under ios/App - since
      # this genuinely shifted once already after removing the earlier
      # "cd ios/App" step, matching broadly here is safer than guessing
      # the exact single path again.
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - teetogreenapex2@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # This lets it go straight to TestFlight for your own testing,
        # without also submitting to Apple's full App Store review -
        # that's a deliberate, separate step for later, once you're
        # actually ready to publish for real.
        submit_to_testflight: true
        submit_to_app_store: false
