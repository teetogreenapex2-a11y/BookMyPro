<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline</title>
<style>
  /* Deliberately no external fonts, images, or scripts here - this page
     has to render correctly with zero network access, since that's
     exactly the situation it exists to handle. */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1B3A2F;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #E3D9C9;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
  }
  .icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid #B8862B;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
    font-size: 28px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 8px;
    color: #FFFFFF;
  }
  p {
    font-size: 14px;
    color: #BFE3CC;
    margin: 0 0 28px;
    max-width: 280px;
    line-height: 1.5;
  }
  button {
    background: #B8862B;
    color: #1B3A2F;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">⛳</div>
    <h1>You're offline</h1>
    <p>BookMyPro needs an internet connection. Check your Wi-Fi or cellular data, then try again.</p>
    <button onclick="location.href='https://bookmypro.app'">Try again</button>
  </div>
</body>
</html>
